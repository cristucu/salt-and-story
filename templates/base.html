<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Salt & Story{% endblock %}</title>
</head>
<body>

    <header>
        <nav>
            <a href="/">Salt & Story</a>

            {% if user.is_authenticated %}
                <span>Hello, {{ user.username }}</span>

                <form method="post" action="{% url 'logout' %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
