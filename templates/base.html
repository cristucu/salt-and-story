{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Salt & Story{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <header>
        <nav>
    <a href="{% url 'home' %}">Salt & Story</a>

    <a href="{% url 'recipes:list' %}">Recipes</a>
    <a href="{% url 'recipes:latest' %}">Latest</a>

    {% if user.is_authenticated %}
        <a href="{% url 'recipes:add' %}">Add Recipe</a>
        <span>Hello, {{ user.username }}</span>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}">Login</a>
    {% endif %}
</nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
