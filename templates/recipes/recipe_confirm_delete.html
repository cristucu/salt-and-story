{% extends "base.html" %}

{% block title %}Delete {{ recipe.title }} | Salt & Story{% endblock %}

{% block content %}
    <section class="delete-page">
        <p class="hero-eyebrow">Delete recipe</p>

        <h1>Are you sure?</h1>

        <p>
            You are about to permanently delete
            <strong>{{ recipe.title }}</strong>.
        </p>

        <div class="delete-actions">
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn-danger">
                    Yes, Delete
                </button>
            </form>

            <a class="btn btn-secondary"
               href="{% url 'recipes:detail' recipe.pk %}">
                Cancel
            </a>
        </div>
    </section>
{% endblock %}
